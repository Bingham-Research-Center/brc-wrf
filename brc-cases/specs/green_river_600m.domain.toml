# Green River corridor 600 m -- domain spec (TWO DOMAINS, no fine nest).
#
# Derived from specs/ashley_drainage_600m.domain.toml by changing the FOOTPRINT and
# nothing else. dx, ratios, time step, truelats, terrain source and feedback are all
# inherited from the configuration that measured 0.597 wall-h/sim-h at zero CFL
# (job 14338744). Rationale, and why the proven footprint was insufficient, live in
# ../ub-wx/experiments/20251121-green-river-cold-reservoir/notes.md -- not here.
#
# This is the human-editable description of WHAT must be covered. The geometry
# (e_we/e_sn/i_parent_start/...) is DERIVED from it by domain_calc.py, so a domain
# change is an edit here plus a re-render, never a hand-edited namelist.
#
#   python brc-cases/domain_calc.py brc-cases/specs/green_river_600m.domain.toml

[case]
name = "green_river_600m"
header = """green_river_600m -- DRAFT namelist.wps (Gate B input, NOT accepted geometry)
GENERATED by brc-cases/domain_calc.py from specs/green_river_600m.domain.toml.
Do not hand-edit: edit the spec and re-render, or the namelist and the experiment
record will disagree about what ran.

Two-domain 5:1 ladder, 3 km -> 600 m, one-way (feedback=0). d02 spans the Green
River trench from the Wyoming approach above Flaming Gorge to Split Mountain, plus
the Yampa inlet at Deerlodge Park. i/j_parent_start are DERIVED and must still be
confirmed against a geogrid-only preview PNG before this geometry is accepted."""

[grid]
# INHERITED UNCHANGED from ashley_drainage_600m. The extension does NOT raise the
# maximum grid-scale slope -- 32.0 deg emulated over the new footprint against 31.4
# on the proven one, because it adds a large area of gentle Wyoming Basin -- so the
# stability predictor tan(max slope)*dt/(6*dx) stays at 0.51 against a 0.69-0.77
# failure threshold, and the time step does not need to move. Dropping d02's dt via
# parent_time_step_ratio 5 would be insurance against a hazard the terrain says does
# not exist, at +64% on the dominant domain.
dx                     = [3000.0, 600.0]
parent_grid_ratio      = [1, 5]
parent_time_step_ratio = [1, 3]
time_step              = 9.0

# Re-centred on the corridor rather than on Ashley Valley: the midpoint of the
# [target] bbox below, so d01 and d02 stay concentric.
ref_lat   = 40.875
ref_lon   = -109.40
# HELD AT 39/42, deliberately, even though d01 now reaches ~42.7 N. These bracket
# D02 -- the domain that carries the answer -- so the map factor stays within a few
# parts in ten thousand of 1 across it. Re-cutting them to bracket d01 would trade a
# real error on d02 for a cosmetic one on a relay domain. The sibling's inherited
# 30/60 left a map factor of 0.9695 and made a nominal 120 m grid really 123.8 m; that
# is the failure this pair exists to avoid, and it is about d02, not d01.
# MEASURED at gate B: mean spacing 600.392 m here against 600.661 m on the Ashley
# footprint. NOT identical -- ref_lat moved 40.26 -> 40.875 -- but 0.045% apart, which
# is immaterial. Do not claim the two grids have the same true spacing; they do not.
truelat1  = 39.0
truelat2  = 42.0
stand_lon = -109.40

# Parent cells of clearance to aim for when auto-sizing an intermediate domain.
nest_margin_cells = 30

# 3-arc-second custom terrain (~90 m source for a 600 m grid: matched). The
# 1-arc-second set built for the 37 m sibling is over-resolved here and was measured
# to DESTABILISE a fine grid by generating 56-degree grid-scale slopes.
geog_data_res  = ["default", "brc_custom_3s+default"]
geog_data_path = "/scratch/general/vast/u0737349/wps_geog_terrain3s/"

[coarse]
# d01: synoptic relay only, 4.7% of the work, so margin here is nearly free. Sized to
# wrap d02 with the full 30-parent-cell clearance on every side.
e_we = 141
e_sn = 141

[target]
# THE GREEN RIVER TRENCH, plus enough up-drainage fetch that what arrives in it is
# model-generated rather than imported through the boundary.
#
# NORTH EDGE 41.90. Flaming Gorge reservoir runs 40.885 N to 41.473 N; the proven
# footprint stopped at 41.04, holding 26% of it, all within 15 km of the boundary.
# 41.90 puts the whole reservoir inside with its north tip 48 km in and Green River,
# WY 43 km in. The binding argument is FETCH, not geometry: at 2-5 m/s over the 14 h
# from sunset, air travels 100-250 km, so a shorter domain measures HRRR.
#
# EAST EDGE -108.10 buys the Yampa inlet at Deerlodge Park (5 km inset on the proven
# footprint -> 36 km here), without which a Yampa-sourced layer cannot be one of the
# tracer sources. PAID FOR by trimming the west to -110.70, which drops Duchesne to
# ~26 km inset -- ample, and the west Basin is not what this experiment asks about.
#
# SOUTH EDGE 39.85 keeps the Book Cliffs and the basin floor south of the trench, so
# the Basin-wide cold-air reservoir stays representable as it did on the sibling.
bbox = [-110.70, 39.85, -108.10, 41.90]
# RAISED 2.0 -> 30.0. Waypoint containment is the only check domain_calc.py makes
# that knows what the domain is FOR, and on a corridor domain 2 km would happily pass
# a footprint that clips Manila into the relaxation zone.
waypoint_min_inset_km = 30.0

[target.waypoints]
# North to south down the trench. Coordinates are the SYNOPTIC STATION positions
# where one exists, so the containment check and the verification sites are the same
# points -- see CHK-TRUTH in the ub-wx entry, which confirmed each of these returned
# wind and temperature through the night of 21-22 Nov 2025.
manila           = [-109.72754, 40.98347]   # UCC25, reservoir west arm
flaming_gorge    = [-109.42111, 40.915]     # FLGU1, reservoir near the dam
dutch_john       = [-109.38986, 40.92258]   # UTMU1 (Manila 18ESE)
cart_creek       = [-109.41694, 40.88472]   # CCRU1
kings_point      = [-109.10344, 40.85975]   # KPRU1, Browns Park approach
gates_of_lodore  = [-108.890, 40.722]       # no station; canyon head
echo_park        = [-108.990, 40.518]       # no station; Yampa confluence
deerlodge        = [-108.530, 40.445]       # no station; Yampa inlet
diamond_rim      = [-109.24278, 40.61722]   # DIAU1, plateau tracer source
split_mountain   = [-109.35326, 40.39136]   # SPMU1
dinosaur_nm      = [-109.30470, 40.43720]   # A3822
dry_fork         = [-109.60627, 40.52349]   # PC101, the Ashley anchor

[share]
# EVENT: 21-22 NOVEMBER 2025, init 12Z. Justification is gate A0 of the ub-wx entry
# 20251121-green-river-cold-reservoir -- do not restate it here.
#
# WINDOW: 12Z 21 Nov -> 16Z 22 Nov (28 h) is what wrf.exe integrates -- see [run].
# end_date below is deliberately LATER, 22Z 22 Nov, so real.exe builds a wrfbdy_d01
# spanning 34 h. That makes a later RESTART EXTENSION legal without re-running WPS.
#
# end_date MUST EQUAL THE LAST STAGED LEAD, not a round number. It was 00Z 23 Nov in
# the first draft, which is 37 valid times against the 35 actually staged (f00..f34) --
# metgrid would have asked ungrib for two intermediates that do not exist and died at
# gate C. The staged span and this date are one decision, not two: 12Z + 34 h = 22Z on
# the 22nd. Change one and you must change the other.
start_date       = "2025-11-21_12:00:00"
end_date         = "2025-11-22_22:00:00"
interval_seconds = 3600
# MUST match nocolons in namelist.input &time_control. Nothing reconciles the two
# flags: without this, WPS writes met_em...12:00:00.nc while real.exe asks for
# ...12_00_00.nc and dies "bad date in namelist or file not in directory". Cost a
# gate D submission (job 14311434) on the sibling before it was tracked as
# CHK-NOCOLONS.
nocolons         = true

[run]
hours = 28   # wrf.exe integrates 12Z 21 Nov -> 16Z 22 Nov; wrfbdy runs to 00Z 23 Nov
