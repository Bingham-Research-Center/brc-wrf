interval_seconds = 3600
nocolons = true

[run]
hours = 48

# PORTS ARE NOT TARGET WAYPOINTS. The five Basin ports sit ON the d02 boundary by construction
# (they are where the Green, Little Snake, Yampa and White corridors cross it), so as targets they
# would always fail the inset test (domain_calc.py 2026-09-15: the Desolation port 0.3 km outside,
# the others 1.7-4.2 km inside). Their gate lines live in brc-tools lookups.toml [gates.port_*] and
